<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WebSocket Direct Messages Test Client</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        #log {
            border: 1px solid #ccc;
            height: 500px;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            margin: 10px 0;
        }
        .msg { margin: 4px 0; }
        .sent { color: blue; }
        .recv { color: green; }
        .sys { color: gray; font-style: italic; }
        .error { color: red; }
        input, select, button {
            padding: 8px;
            margin: 2px;
        }
        button {
            cursor: pointer;
        }
        .row {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <h2>WebSocket Direct Messages Test</h2>

    <div class="row">
        <strong>Your User ID:</strong>
        <input id="userId" placeholder="e.g. alice" value="alice" style="width: 200px;">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>

    <div class="row">
        <strong>Send to:</strong>
        <input id="targetId" placeholder="bob" value="bob" style="width: 150px;">
        <input id="message" placeholder="Type message..." style="width: 400px;">
        <button onclick="sendMessage()">Send</button>
    </div>

    <h3>Status: <span id="status">disconnected</span></h3>
    <div id="log"></div>

    <script>
        let ws = null;
        const log = document.getElementById("log");
        const statusEl = document.getElementById("status");

        function logMsg(text, cls = "sys") {
            const div = document.createElement("div");
            div.className = `msg ${cls}`;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                logMsg("Already connected", "sys");
                return;
            }

            const userId = document.getElementById("userId").value.trim();
            if (!userId) {
                logMsg("User ID is required!", "error");
                return;
            }

            const url = `ws://localhost:8000/ws/${encodeURIComponent(userId)}`;
            ws = new WebSocket(url);

            ws.onopen = () => {
                statusEl.textContent = `connected as ${userId}`;
                statusEl.style.color = "green";
                logMsg(`>>> Connected as user: ${userId}`, "sys");
            };

            ws.onmessage = (event) => {
                const data = event.data;
                if (data.startsWith("[from ")) {
                    logMsg(`<<< ${data}`, "recv");
                } else {
                    logMsg(`<<< ${data}`, "sys");
                }
            };

            ws.onclose = () => {
                statusEl.textContent = "disconnected";
                statusEl.style.color = "red";
                logMsg("<<< Disconnected", "sys");
                ws = null;
            };

            ws.onerror = () => {
                logMsg("<<< Connection Error", "error");
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                logMsg("Not connected!", "error");
                return;
            }

            const targetId = document.getElementById("targetId").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!targetId) {
                logMsg("Target user ID is required!", "error");
                return;
            }
            if (!message) return;

            // Format expected by server: "target_id:message"
            const payload = `${targetId}:${message}`;
            ws.send(payload);

            logMsg(`>>> [to ${targetId}] ${message}`, "sent");
            document.getElementById("message").value = "";
        }

        // Allow pressing Enter to send
        document.getElementById("message").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        // Optional: Auto-connect when page loads (remove if you prefer manual)
        // window.onload = connect;
    </script>
</body>
</html>
